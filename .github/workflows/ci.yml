name: CI

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["*"]

env:
  AWS_REGION: ap-northeast-2

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🧪 Run tests
        run: npm run test

      - name: 🧪 Run e2e tests
        run: npm run test:e2e:ci

      - name: 🏗️ Build
        run: npm run build
