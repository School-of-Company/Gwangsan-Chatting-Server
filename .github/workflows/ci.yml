name: CI

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"  # Dockerfile 런타임과 동일
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🧪 Run tests
        run: npm run test

      - name: 🧪 Run e2e tests
        run: npm run test:e2e:ci

      - name: 🏗️ Build
        run: npm run build

  release-checks:
    # 배포 경로 검증만 한다. 레지스트리 push·배포는 CD.yml(수동, production 승인) 전용.
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔍 Shellcheck release scripts
        run: shellcheck scripts/release/*.sh

      - name: 🧪 Release script regression test
        run: bash scripts/release/test-deploy-container.sh

      - name: 🐳 Docker image build (no push)
        run: docker build -t gwangsan-chat:ci .

      - name: 🐳 Image preload smoke
        run: |
          # CMD 의 --require 대상(preload) 파일 존재와 Node 22 런타임 확인
          docker run --rm --entrypoint node gwangsan-chat:ci -e "require('fs').accessSync('dist/src/instrumentation.js'); if (!process.versions.node.startsWith('22.')) process.exit(1)"
